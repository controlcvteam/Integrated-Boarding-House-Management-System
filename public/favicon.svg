<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded shield -->
  <rect width="64" height="64" rx="16" fill="url(#roofGrad)" />

  <!-- Chimney -->
  <rect x="42" y="16" width="6" height="12" rx="1.5" fill="#38bdf8" opacity="0.85" />

  <!-- Roof triangle -->
  <path d="M 12 30 L 32 14 L 52 30 Z" fill="url(#houseGrad)" filter="url(#shadow)" />

  <!-- House Body -->
  <path d="M 16 29 L 16 48 C 16 49.5 17.5 51 19 51 L 45 51 C 46.5 51 48 49.5 48 48 L 48 29 Z" fill="#ffffff" opacity="0.95" />

  <!-- Door -->
  <rect x="27" y="37" width="10" height="14" rx="2" fill="url(#houseGrad)" />

  <!-- Window 1 -->
  <rect x="20" y="33" width="5" height="5" rx="1" fill="#0284c7" opacity="0.75" />

  <!-- Window 2 -->
  <rect x="39" y="33" width="5" height="5" rx="1" fill="#0284c7" opacity="0.75" />

  <!-- Door knob -->
  <circle cx="34.5" cy="44" r="1" fill="#ffffff" />
</svg>

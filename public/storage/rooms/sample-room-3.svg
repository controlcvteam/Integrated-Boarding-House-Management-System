<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="floorGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#543007"/>
    </linearGradient>
    <linearGradient id="windowGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="softShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="380" fill="url(#wallGrad3)"/>
  <rect y="375" width="800" height="15" fill="#115e59"/>
  <rect y="390" width="800" height="110" fill="url(#floorGrad3)"/>
  
  <line x1="0" y1="425" x2="800" y2="425" stroke="#a16207" stroke-width="1.5" opacity="0.4"/>
  <line x1="0" y1="465" x2="800" y2="465" stroke="#a16207" stroke-width="1.5" opacity="0.4"/>

  <!-- Window -->
  <rect x="520" y="50" width="220" height="180" rx="6" fill="url(#windowGrad3)"/>
  <circle cx="580" cy="100" r="25" fill="#fef08a" opacity="0.9"/>
  <rect x="520" y="50" width="220" height="180" fill="none" stroke="#f0fdfa" stroke-width="6" rx="6"/>
  <line x1="630" y1="50" x2="630" y2="230" stroke="#f0fdfa" stroke-width="4"/>
  <line x1="520" y1="140" x2="740" y2="140" stroke="#f0fdfa" stroke-width="4"/>

  <!-- Bed -->
  <rect x="140" y="210" width="340" height="175" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="3"/>
  <rect x="160" y="250" width="120" height="48" rx="8" fill="#ffffff" filter="url(#softShadow3)"/>
  <rect x="330" y="250" width="120" height="48" rx="8" fill="#ffffff" filter="url(#softShadow3)"/>
  <rect x="175" y="262" width="90" height="34" rx="6" fill="#99f6e4"/>
  <rect x="345" y="262" width="90" height="34" rx="6" fill="#99f6e4"/>

  <rect x="135" y="295" width="350" height="100" rx="6" fill="#f8fafc"/>
  <rect x="135" y="325" width="350" height="75" rx="6" fill="#0d9488" filter="url(#softShadow3)"/>
  <rect x="135" y="355" width="350" height="40" fill="#14b8a6"/>

  <rect x="150" y="395" width="14" height="25" rx="2" fill="#0f172a"/>
  <rect x="455" y="395" width="14" height="25" rx="2" fill="#0f172a"/>

  <!-- Nightstand & Lamp -->
  <rect x="520" y="290" width="80" height="95" rx="4" fill="#134e4a" filter="url(#softShadow3)"/>
  <rect x="557" y="255" width="6" height="35" fill="#94a3b8"/>
  <path d="M540 255 L580 255 L572 225 L548 225 Z" fill="#fbbf24"/>
  <circle cx="560" cy="240" r="10" fill="#fef08a" opacity="0.6"/>

  <!-- Badge -->
  <g transform="translate(25, 25)">
    <rect width="180" height="34" rx="17" fill="#0d9488" opacity="0.9"/>
    <circle cx="17" cy="17" r="7" fill="#5eead4"/>
    <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">SINGLE DELUXE ROOM</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="floorGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="windowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="bedGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="duvetGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="softShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Wall & Room Background -->
  <rect width="800" height="380" fill="url(#wallGrad2)"/>
  
  <!-- Baseboard & Flooring -->
  <rect y="375" width="800" height="15" fill="#312e81"/>
  <rect y="390" width="800" height="110" fill="url(#floorGrad2)"/>
  
  <!-- Floor Planks -->
  <line x1="0" y1="425" x2="800" y2="425" stroke="#9a3412" stroke-width="1.5" opacity="0.4"/>
  <line x1="0" y1="465" x2="800" y2="465" stroke="#9a3412" stroke-width="1.5" opacity="0.4"/>
  <line x1="250" y1="390" x2="220" y2="425" stroke="#9a3412" stroke-width="1.5" opacity="0.4"/>
  <line x1="600" y1="390" x2="570" y2="425" stroke="#9a3412" stroke-width="1.5" opacity="0.4"/>
  <line x1="420" y1="425" x2="390" y2="465" stroke="#9a3412" stroke-width="1.5" opacity="0.4"/>

  <!-- Balcony / High Window View -->
  <rect x="60" y="40" width="220" height="230" rx="6" fill="url(#windowGrad2)"/>
  <!-- Sunset skyline silhouettes -->
  <circle cx="170" cy="110" r="28" fill="#fef08a" opacity="0.95"/>
  <polygon points="60,270 110,190 140,270" fill="#431407" opacity="0.4"/>
  <polygon points="120,270 170,170 220,270" fill="#431407" opacity="0.5"/>
  <polygon points="180,270 240,200 280,270" fill="#431407" opacity="0.4"/>
  <!-- Frame & Glass Panes -->
  <rect x="60" y="40" width="220" height="230" fill="none" stroke="#e0e7ff" stroke-width="6" rx="6"/>
  <line x1="170" y1="40" x2="170" y2="270" stroke="#e0e7ff" stroke-width="4"/>
  <line x1="60" y1="160" x2="280" y2="160" stroke="#e0e7ff" stroke-width="4"/>

  <!-- Wall Bookshelf (Center Wall) -->
  <rect x="340" y="70" width="160" height="12" rx="3" fill="#cbd5e1"/>
  <!-- Books on Shelf -->
  <rect x="355" y="42" width="10" height="28" fill="#38bdf8"/>
  <rect x="367" y="38" width="12" height="32" fill="#f43f5e"/>
  <rect x="381" y="45" width="9" height="25" fill="#eab308"/>
  <rect x="392" y="40" width="14" height="30" fill="#10b981"/>
  <!-- Small Succulent on Shelf -->
  <polygon points="450,70 470,70 475,54 445,54" fill="#ea580c"/>
  <circle cx="460" cy="48" r="8" fill="#34d399"/>

  <!-- Study Desk (Right Side) -->
  <rect x="580" y="270" width="170" height="15" rx="3" fill="#e2e8f0" filter="url(#softShadow2)"/>
  <rect x="590" y="285" width="12" height="110" fill="#94a3b8"/>
  <rect x="730" y="285" width="12" height="110" fill="#94a3b8"/>
  <!-- Laptop on Desk -->
  <rect x="625" y="250" width="45" height="20" rx="3" fill="#475569"/>
  <polygon points="620,270 675,270 670,268 625,268" fill="#cbd5e1"/>
  <!-- Desk Lamp -->
  <path d="M710 270 L710 230 L690 220" stroke="#f59e0b" stroke-width="3" fill="none"/>
  <polygon points="685,215 700,215 705,228 680,228" fill="#fbbf24"/>
  <ellipse cx="692" cy="235" rx="16" ry="6" fill="#fef08a" opacity="0.4"/>
  <!-- Ergonomic Chair -->
  <ellipse cx="640" cy="380" rx="28" ry="12" fill="#1e293b"/>
  <rect x="636" y="340" width="8" height="40" fill="#475569"/>
  <rect x="620" y="325" width="40" height="20" rx="6" fill="#4f46e5"/>
  <rect x="625" y="285" width="30" height="40" rx="5" fill="#4f46e5"/>

  <!-- Comfy Bed Setup (Center-Left) -->
  <rect x="220" y="200" width="340" height="185" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="3"/>
  <!-- Pillows -->
  <rect x="240" y="245" width="125" height="50" rx="10" fill="#ffffff" filter="url(#softShadow2)"/>
  <rect x="400" y="245" width="125" height="50" rx="10" fill="#ffffff" filter="url(#softShadow2)"/>
  <rect x="255" y="258" width="95" height="36" rx="6" fill="#c7d2fe"/>
  <rect x="415" y="258" width="95" height="36" rx="6" fill="#c7d2fe"/>

  <!-- Mattress & Duvet -->
  <rect x="215" y="290" width="350" height="105" rx="6" fill="#e2e8f0"/>
  <rect x="215" y="320" width="350" height="80" rx="6" fill="url(#duvetGrad2)" filter="url(#softShadow2)"/>
  <rect x="215" y="350" width="350" height="45" fill="url(#bedGrad2)"/>
  <line x1="215" y1="350" x2="565" y2="350" stroke="#818cf8" stroke-width="2"/>

  <!-- Bed Legs -->
  <rect x="230" y="395" width="14" height="25" rx="2" fill="#0f172a"/>
  <rect x="535" y="395" width="14" height="25" rx="2" fill="#0f172a"/>

  <!-- Area Rug under Bed -->
  <ellipse cx="380" cy="445" rx="240" ry="36" fill="#4338ca" opacity="0.25"/>

  <!-- Room Badge / Tag -->
  <g transform="translate(25, 25)">
    <rect width="180" height="34" rx="17" fill="#4f46e5" opacity="0.9"/>
    <circle cx="17" cy="17" r="7" fill="#a5b4fc"/>
    <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">DELUXE TWIN SUITE</text>
  </g>
</svg>
